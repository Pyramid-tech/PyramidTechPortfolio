name: Deploy alerts

on:
  push:
    branches: [master]
  deployment_status:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post deployment status to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          STATE: ${{ github.event.deployment_status.state }}
          ENVIRONMENT: ${{ github.event.deployment_status.environment }}
          DEPLOY_SHA: ${{ github.event.deployment.sha }}
          DEPLOY_REF: ${{ github.event.deployment.ref }}
          DEPLOY_COMMIT_REF: ${{ github.event.deployment.payload.githubCommitRef }}
          SITE_URL: ${{ github.event.deployment_status.environment_url }}
          LOG_URL: ${{ github.event.deployment_status.target_url }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "push" ]; then
            echo "::notice::push to '${PUSH_BRANCH}'"
            TITLE="🔵 DEPLOYING"
            COLOR=3447003
            SHA="$PUSH_SHA"
            BRANCH="$PUSH_BRANCH"
            SITE_URL=""
            LOG_URL=""
          else
            echo "::notice::state='${STATE}' environment='${ENVIRONMENT}' ref='${DEPLOY_REF}' commitRef='${DEPLOY_COMMIT_REF}'"

            ENV_LC=$(printf '%s' "$ENVIRONMENT" | tr '[:upper:]' '[:lower:]')
            case "$ENV_LC" in
              *production*) ;;
              *) echo "environment '${ENVIRONMENT}' is not production, nothing to post"; exit 0 ;;
            esac

            case "$STATE" in
              success) TITLE="🟢 DEPLOYED";      COLOR=3066993  ;;
              failure) TITLE="🔴 DEPLOY FAILED"; COLOR=15158332 ;;
              error)   TITLE="🔴 DEPLOY ERROR";  COLOR=15158332 ;;
              *)       echo "state '${STATE}' is not reported, nothing to post"; exit 0 ;;
            esac

            SHA="$DEPLOY_SHA"
            BRANCH=$(printf '%s' "$DEPLOY_REF" | sed 's#^refs/heads/##')
            if printf '%s' "$BRANCH" | grep -qE '^[0-9a-f]{40}$'; then
              BRANCH="$DEPLOY_COMMIT_REF"
            fi
            if [ "$LOG_URL" = "$SITE_URL" ]; then
              LOG_URL=""
            fi
          fi

          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::error::DISCORD_WEBHOOK_URL secret is not set"
            exit 1
          fi

          COMMIT_JSON=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA") || COMMIT_JSON=""

          SUBJECT=$(printf '%s' "$COMMIT_JSON" | jq -r '.commit.message // ""' | head -n 1) || SUBJECT=""
          AUTHOR=$(printf '%s' "$COMMIT_JSON" | jq -r '.author.login // .commit.author.name // ""') || AUTHOR=""

          SHORT_SHA=$(printf '%s' "$SHA" | cut -c1-7)

          jq -n \
            --arg title "$TITLE" \
            --argjson color "$COLOR" \
            --arg sha "$SHA" \
            --arg short_sha "$SHORT_SHA" \
            --arg subject "$SUBJECT" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg repo "$REPO" \
            --arg site "$SITE_URL" \
            --arg log "$LOG_URL" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
               embeds: [{
                 title: $title,
                 description: (
                   "[`" + $short_sha + "`](https://github.com/" + $repo + "/commit/" + $sha + ")"
                   + (if $branch != "" then " on `" + $branch + "`" else "" end)
                   + (if $subject != "" then "\n" + $subject else "" end)
                 ),
                 color: $color,
                 timestamp: $ts,
                 footer: { text: "Pyramid" },
                 fields: (
                   (if $author != "" then [{ name: "Author", value: $author, inline: true }] else [] end)
                   + (if $site != "" then [{ name: "Site", value: $site, inline: false }] else [] end)
                   + (if $log  != "" then [{ name: "Build log", value: $log,  inline: false }] else [] end)
                 )
               }]
             }' > payload.json

          curl -sS --fail-with-body -X POST \
            -H "Content-Type: application/json" \
            -d @payload.json \
            "$DISCORD_WEBHOOK_URL"
